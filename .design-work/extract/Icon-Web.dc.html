<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-900: #1e3a8a; --blue-300: #93c5fd; --blue-100: #dbeafe;
    --font-display: 'Fraunces', Georgia, serif;
    --font-mono: 'Geist Mono', 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-mono); }
  .frame {
    width: 640px; height: 640px;
    background: var(--blue-900);
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    display: flex; align-items: center; justify-content: center;
    position: relative; color: white;
  }
  .tag { position: absolute; top: 28px; left: 28px; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
  .fig { position: absolute; bottom: 28px; left: 28px; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-300); }
  .fig b { display: block; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; text-transform: none; letter-spacing: 0; color: white; margin-top: 0.35rem; }

  svg { overflow: visible; }
  .stroke { fill: none; stroke: white; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .stroke-soft { fill: none; stroke: rgba(255,255,255,0.35); stroke-width: 1.25; stroke-linecap: round; }
  .stroke-accent { fill: none; stroke: var(--blue-300); stroke-width: 1.5; stroke-linecap: round; }
  .dot { fill: rgba(255,255,255,0.5); }

  .line1 { stroke-dasharray: 96; stroke-dashoffset: 96; animation: draw 1.6s cubic-bezier(.65,0,.35,1) infinite; }
  .line2 { stroke-dasharray: 150; stroke-dashoffset: 150; animation: draw 1.6s cubic-bezier(.65,0,.35,1) infinite; animation-delay: 0.35s; }
  .line3 { stroke-dasharray: 70; stroke-dashoffset: 70; animation: draw 1.6s cubic-bezier(.65,0,.35,1) infinite; animation-delay: 0.7s; }

  @keyframes draw {
    0% { stroke-dashoffset: var(--len, 100); opacity: 0.3; }
    45% { stroke-dashoffset: 0; opacity: 1; }
    75% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0.3; }
  }

  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .bracket { animation: nudge 3.4s ease-in-out infinite; transform-origin: 130px 210px; }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .line1, .line2, .line3, .cursor, .bracket { animation: none; stroke-dashoffset: 0; opacity: 1; }
  }
</style>
</helmet>

<div class="frame">
  <span class="tag">Icon proposal</span>
  <span class="fig">Fig. 01<b>Web development</b></span>

  <svg width="320" height="320" viewBox="0 0 320 320">
    <!-- browser window -->
    <rect class="stroke" x="30" y="60" width="260" height="200" rx="10" />
    <line class="stroke-soft" x1="30" y1="102" x2="290" y2="102" />
    <circle class="dot" cx="50" cy="81" r="3.5" />
    <circle class="dot" cx="63" cy="81" r="3.5" />
    <circle class="dot" cx="76" cy="81" r="3.5" />

    <!-- code bracket -->
    <g class="bracket stroke-accent">
      <polyline points="112 150 96 172 112 194" />
      <polyline points="150 150 166 172 150 194" />
    </g>

    <!-- typing lines -->
    <line class="stroke line1" x1="185" y1="150" x2="245" y2="150" style="--len:60" />
    <line class="stroke-soft line2" x1="185" y1="172" x2="255" y2="172" style="--len:70" />
    <line class="stroke line3" x1="185" y1="194" x2="220" y2="194" style="--len:35" />
    <rect class="dot cursor" x="222" y="188" width="9" height="13" />
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
