<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-900: #1e3a8a; --blue-300: #93c5fd;
    --font-display: 'Fraunces', Georgia, serif;
    --font-mono: 'Geist Mono', 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-mono); }
  .frame {
    width: 640px; height: 640px;
    background: var(--blue-900);
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    display: flex; align-items: center; justify-content: center;
    position: relative; color: white;
  }
  .tag { position: absolute; top: 28px; left: 28px; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
  .fig { position: absolute; bottom: 28px; left: 28px; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-300); }
  .fig b { display: block; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; text-transform: none; letter-spacing: 0; color: white; margin-top: 0.35rem; }

  svg { overflow: visible; }
  .ring { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 1.25; stroke-dasharray: 3 6; }
  .spoke { stroke: rgba(255,255,255,0.4); stroke-width: 1.25; stroke-dasharray: 3 5; }
  .core-ring { fill: none; stroke: white; stroke-width: 1.5; }
  .sparkle { stroke: var(--blue-300); stroke-width: 1.75; stroke-linecap: round; }

  .ring-spin { animation: spin 30s linear infinite; transform-origin: 160px 160px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .core { animation: pulse 2.6s ease-in-out infinite; transform-origin: 160px 160px; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.85; }
  }

  .node { fill: white; animation: nodepulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes nodepulse {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50% { transform: scale(1.6); opacity: 1; }
  }
  .n1 { animation-delay: 0s; }
  .n2 { animation-delay: 0.4s; }
  .n3 { animation-delay: 0.8s; }
  .n4 { animation-delay: 1.2s; }
  .n5 { animation-delay: 1.6s; }
  .n6 { animation-delay: 2s; }

  @media (prefers-reduced-motion: reduce) {
    .ring-spin, .core, .node { animation: none; }
  }
</style>
</helmet>

<div class="frame">
  <span class="tag">Icon proposal</span>
  <span class="fig">Fig. 02<b>AI integration</b></span>

  <svg width="320" height="320" viewBox="0 0 320 320">
    <g class="ring-spin">
      <circle class="ring" cx="160" cy="160" r="105" />
    </g>
    <circle class="ring" cx="160" cy="160" r="60" style="stroke-dasharray:2 5;" />

    <g class="spoke">
      <line x1="160" y1="160" x2="160" y2="55" />
      <line x1="160" y1="160" x2="252" y2="107" />
      <line x1="160" y1="160" x2="252" y2="213" />
      <line x1="160" y1="160" x2="160" y2="265" />
      <line x1="160" y1="160" x2="68" y2="213" />
      <line x1="160" y1="160" x2="68" y2="107" />
    </g>

    <circle class="node n1" cx="160" cy="55" r="4.5" />
    <circle class="node n2" cx="252" cy="107" r="4.5" />
    <circle class="node n3" cx="252" cy="213" r="4.5" />
    <circle class="node n4" cx="160" cy="265" r="4.5" />
    <circle class="node n5" cx="68" cy="213" r="4.5" />
    <circle class="node n6" cx="68" cy="107" r="4.5" />

    <g class="core">
      <circle class="core-ring" cx="160" cy="160" r="26" />
      <path class="sparkle" d="M160 137v11M160 172v11M137 160h11M172 160h11M144.8 144.8l3.9 3.9M171.3 171.3l3.9 3.9M175.2 144.8l-3.9 3.9M148.7 171.3l-3.9 3.9" />
    </g>
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
